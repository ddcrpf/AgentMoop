name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Don't paste tokens or private messages."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Claude Code
        - Codex
        - Claude app
        - Web
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, tool version, Node version (if self-hosting), browser
